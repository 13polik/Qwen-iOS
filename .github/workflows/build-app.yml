name: Build Qwen Local 0.3

on:
workflow_dispatch:

jobs:
build:
runs-on: macos-latest

steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Clone llama.cpp
    run: |
      git clone --depth 1 https://github.com/ggml-org/llama.cpp.git

  - name: Download iOS platform
    run: |
      xcodebuild -downloadPlatform iOS

  - name: Inspect llama.swiftui structure
    run: |
      echo "=== llama.swiftui files ==="

      find llama.cpp/examples/llama.swiftui \
        -maxdepth 5 \
        -type f \
        | sort \
        | head -300

      echo
      echo "=== Swift files ==="

      find llama.cpp/examples/llama.swiftui \
        -type f \
        -name "*.swift" \
        | sort

  - name: Download Qwen model
    run: |
      MODEL_DIR="llama.cpp/examples/llama.swiftui/llama.swiftui/Resources/models"

      mkdir -p "$MODEL_DIR"

      curl -L \
        "https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_k_m.gguf" \
        -o "$MODEL_DIR/ggml-model.gguf"

      echo
      echo "=== Downloaded model ==="

      ls -lh "$MODEL_DIR/ggml-model.gguf"

      SIZE=$(stat -f%z "$MODEL_DIR/ggml-model.gguf")

      echo "Model size: $SIZE bytes"

      if [ "$SIZE" -lt 500000000 ]; then
        echo "ERROR: Model file is too small."
        exit 1
      fi

  - name: Verify Qwen model
    run: |
      MODEL="llama.cpp/examples/llama.swiftui/llama.swiftui/Resources/models/ggml-model.gguf"

      if [ ! -f "$MODEL" ]; then
        echo "ERROR: Qwen model was not downloaded."
        exit 1
      fi

      echo "Qwen model found:"
      ls -lh "$MODEL"

  - name: Configure default Qwen model
    run: |
      python3 <<'PY'
      from pathlib import Path
      import re

      file = Path(
          "llama.cpp/examples/llama.swiftui/llama.swiftui/Models/LlamaState.swift"
      )

      if not file.exists():
          print("ERROR: LlamaState.swift not found.")
          print()
          print("Searching for it:")

          for p in Path("llama.cpp/examples/llama.swiftui").rglob("LlamaState.swift"):
              print(p)

          raise SystemExit(1)

      text = file.read_text(encoding="utf-8")

      pattern = re.compile(
          r"private\s+let\s+defaultModels\s*:\s*\[Model\]\s*=\s*\["
          r".*?"
          r"\n\s*\]\s*\n",
          re.DOTALL
      )

      replacement = '''private let defaultModels: [Model] = [
          Model(
              name: "Qwen2.5-1.5B-Instruct (Q4_K_M)",
              url: "",
              filename: "ggml-model.gguf",
              status: "downloaded"
          )
      ]

      '''

      new_text, count = pattern.subn(
          replacement,
          text,
          count=1
      )

      if count != 1:
          print("ERROR: Could not find defaultModels block.")
          print()
          print("Relevant section:")

          start = text.find("defaultModels")

          if start >= 0:
              print(text[start:start + 5000])

          raise SystemExit(1)

      file.write_text(
          new_text,
          encoding="utf-8"
      )

      print("defaultModels successfully configured.")
      PY

  - name: Verify default Qwen configuration
    run: |
      FILE="llama.cpp/examples/llama.swiftui/llama.swiftui/Models/LlamaState.swift"

      echo "=== Qwen configuration ==="

      grep -A12 -B2 \
        'defaultModels' \
        "$FILE" \
        || true

  - name: Verify model resource configuration
    run: |
      echo "=== Xcode project resources ==="

      grep -n \
        "Resources/models" \
        llama.cpp/examples/llama.swiftui/llama.swiftui.xcodeproj/project.pbxproj \
        || true

      echo

      grep -n \
        "models in Resources" \
        llama.cpp/examples/llama.swiftui/llama.swiftui.xcodeproj/project.pbxproj \
        || true

  - name: Build llama xcframework
    working-directory: llama.cpp
    run: |
      cmake \
        -B build \
        -G Xcode \
        -DCMAKE_SYSTEM_NAME=iOS \
        -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 \
        -DLLAMA_BUILD_TESTS=OFF \
        -DLLAMA_BUILD_EXAMPLES=OFF

      cmake \
        --build build \
        --config Release \
        -- -sdk iphoneos

  - name: Locate llama build products
    run: |
      echo "=== Build products ==="

      find llama.cpp/build \
        \( -name "*.framework" -o -name "*.a" \) \
        -print \
        | head -200

  - name: Inspect Xcode project
    run: |
      echo "=== Xcode project ==="

      ls -lah \
        llama.cpp/examples/llama.swiftui

      echo

      echo "=== Schemes ==="

      xcodebuild \
        -list \
        -project \
        llama.cpp/examples/llama.swiftui/llama.swiftui.xcodeproj

  - name: Build Qwen Local application
    working-directory: llama.cpp/examples/llama.swiftui
    run: |
      xcodebuild \
        -project llama.swiftui.xcodeproj \
        -scheme llama.swiftui \
        -configuration Release \
        -sdk iphoneos \
        -destination 'generic/platform=iOS' \
        -archivePath "$GITHUB_WORKSPACE/QwenLocal.xcarchive" \
        PRODUCT_BUNDLE_IDENTIFIER=pl.13polik.QwenLocal \
        MARKETING_VERSION=0.3 \
        CURRENT_PROJECT_VERSION=3 \
        CODE_SIGNING_ALLOWED=NO \
        CODE_SIGNING_REQUIRED=NO \
        DEVELOPMENT_TEAM= \
        archive

  - name: Find application
    run: |
      APP=$(find \
        QwenLocal.xcarchive/Products/Applications \
        -maxdepth 2 \
        -name "*.app" \
        -print \
        | head -1)

      if [ -z "$APP" ]; then
        echo "ERROR: Application was not found."
        exit 1
      fi

      echo "APP=$APP" >> "$GITHUB_ENV"

      echo
      echo "Application found:"
      echo "$APP"

  - name: Inspect compiled application
    run: |
      echo "=== Application contents ==="

      find "$APP" \
        -maxdepth 4 \
        -type f \
        | sort \
        | head -300

  - name: Verify bundled Qwen model
    run: |
      MODEL="$APP/models/ggml-model.gguf"

      echo "Checking:"
      echo "$MODEL"

      if [ ! -f "$MODEL" ]; then
        echo
        echo "ERROR: Qwen model was NOT included in the application bundle."
        echo
        echo "Searching entire application for GGUF files:"

        find "$APP" \
          -type f \
          -name "*.gguf" \
          -print

        echo
        echo "Searching for models directory:"

        find "$APP" \
          -type d \
          -name "models" \
          -print

        exit 1
      fi

      echo
      echo "Qwen model successfully bundled:"
      ls -lh "$MODEL"

  - name: Generate Qwen Local icon
    run: |
      mkdir -p icon

      cat > icon/create_icon.swift <<'SWIFT'
      import Foundation
      import CoreGraphics
      import ImageIO
      import UniformTypeIdentifiers

      let size = 1024

      let colorSpace = CGColorSpaceCreateDeviceRGB()

      guard let context = CGContext(
          data: nil,
          width: size,
          height: size,
          bitsPerComponent: 8,
          bytesPerRow: size * 4,
          space: colorSpace,
          bitmapInfo: CGImageAlphaInfo.premultipliedLast.rawValue
      ) else {
          fatalError("Could not create graphics context")
      }

      let rect = CGRect(
          x: 0,
          y: 0,
          width: size,
          height: size
      )

      context.setFillColor(
          CGColor(
              red: 0.07,
              green: 0.08,
              blue: 0.10,
              alpha: 1
          )
      )

      context.fill(rect)

      let center = CGPoint(
          x: CGFloat(size) / 2,
          y: CGFloat(size) / 2
      )

      context.setFillColor(
          CGColor(
              red: 0.18,
              green: 0.55,
              blue: 1.0,
              alpha: 1
          )
      )

      context.fillEllipse(
          in: CGRect(
              x: center.x - 300,
              y: center.y - 300,
              width: 600,
              height: 600
          )
      )

      context.setFillColor(
          CGColor(
              red: 1,
              green: 1,
              blue: 1,
              alpha: 1
          )
      )

      context.fillEllipse(
          in: CGRect(
              x: center.x - 170,
              y: center.y - 110,
              width: 70,
              height: 100
          )
      )

      context.fillEllipse(
          in: CGRect(
              x: center.x + 100,
              y: center.y - 110,
              width: 70,
              height: 100
          )
      )

      context.setStrokeColor(
          CGColor(
              red: 1,
              green: 1,
              blue: 1,
              alpha: 1
          )
      )

      context.setLineWidth(35)
      context.setLineCap(.round)

      context.move(
          to: CGPoint(
              x: center.x - 160,
              y: center.y + 120
          )
      )

      context.addCurve(
          to: CGPoint(
              x: center.x + 160,
              y: center.y + 120
          ),
          control1: CGPoint(
              x: center.x - 80,
              y: center.y + 210
          ),
          control2: CGPoint(
              x: center.x + 80,
              y: center.y + 210
          )
      )

      context.strokePath()

      guard let image = context.makeImage() else {
          fatalError("Could not create image")
      }

      let url = URL(
          fileURLWithPath: "icon/QwenLocal.png"
      )

      guard let destination = CGImageDestinationCreateWithURL(
          url as CFURL,
          UTType.png.identifier as CFString,
          1,
          nil
      ) else {
          fatalError("Could not create PNG destination")
      }

      CGImageDestinationAddImage(
          destination,
          image,
          nil
      )

      guard CGImageDestinationFinalize(destination) else {
          fatalError("Could not save icon")
      }
      SWIFT

      swiftc \
        icon/create_icon.swift \
        -o icon/create_icon

      icon/create_icon

      file icon/QwenLocal.png

  - name: Add application icon
    run: |
      cp icon/QwenLocal.png "$APP/Icon-60.png"
      cp icon/QwenLocal.png "$APP/Icon-76.png"
      cp icon/QwenLocal.png "$APP/Icon-1024.png"

      /usr/libexec/PlistBuddy \
        -c "Add :CFBundleIconFiles array" \
        "$APP/Info.plist" \
        2>/dev/null || true

      /usr/libexec/PlistBuddy \
        -c "Add :CFBundleIconFiles:0 string Icon-60.png" \
        "$APP/Info.plist" \
        2>/dev/null || true

      /usr/libexec/PlistBuddy \
        -c "Add :CFBundleIconFiles:1 string Icon-76.png" \
        "$APP/Info.plist" \
        2>/dev/null || true

      /usr/libexec/PlistBuddy \
        -c "Add :CFBundleIconFiles:2 string Icon-1024.png" \
        "$APP/Info.plist" \
        2>/dev/null || true

  - name: Verify application
    run: |
      echo "=== Bundle identifier ==="

      /usr/libexec/PlistBuddy \
        -c "Print :CFBundleIdentifier" \
        "$APP/Info.plist"

      echo
      echo "=== Version ==="

      /usr/libexec/PlistBuddy \
        -c "Print :CFBundleShortVersionString" \
        "$APP/Info.plist" \
        2>/dev/null || true

      echo
      echo "=== Model ==="

      ls -lh \
        "$APP/models/ggml-model.gguf"

      echo
      echo "=== Icons ==="

      ls -lh \
        "$APP/Icon-"*.png

  - name: Create IPA
    run: |
      rm -rf Payload

      mkdir -p Payload

      cp -R "$APP" Payload/

      zip \
        -qry \
        QwenLocal-0.3.ipa \
        Payload

      echo
      echo "IPA created:"
      ls -lh QwenLocal-0.3.ipa

  - name: Verify IPA
    run: |
      echo "=== IPA contents ==="

      unzip -l QwenLocal-0.3.ipa \
        | grep -E \
        "ggml-model.gguf|Info.plist|Icon-60|Icon-76|Icon-1024"

      echo
      echo "=== IPA size ==="

      ls -lh QwenLocal-0.3.ipa

  - name: Upload IPA
    uses: actions/upload-artifact@v4
    with:
      name: QwenLocal-0.3-IPA
      path: QwenLocal-0.3.ipa
      retention-days: 7
