name: Build Qwen Local

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Clone llama.cpp
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git

      - name: Build llama.cpp XCFramework
        run: |
          cd llama.cpp
          ./build-xcframework.sh ios-device

      - name: Download Qwen 0.5B
        run: |
          mkdir -p llama.cpp/examples/llama.swiftui/Models

          curl -L \
            -o llama.cpp/examples/llama.swiftui/Models/qwen2.5-0.5b-instruct-q4_k_m.gguf \
            "https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf"

      - name: Copy XCFramework
        run: |
          cp -R \
            llama.cpp/build-apple/llama.xcframework \
            llama.cpp/examples/llama.swiftui/

      - name: Show project
        run: |
          find llama.cpp/examples/llama.swiftui -maxdepth 3 -type f | sort

      - name: Build iOS app
        run: |
          cd llama.cpp

          xcodebuild \
            -project examples/llama.swiftui/llama.swiftui.xcodeproj \
            -scheme llama.swiftui \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Find app
        run: |
          find llama.cpp -name "*.app" -type d -print

      - name: Package IPA
        run: |
          mkdir -p Payload

          APP_PATH=$(find llama.cpp -name "*.app" -type d | head -n 1)

          echo "Using app:"
          echo "$APP_PATH"

          cp -R "$APP_PATH" Payload/

          zip -r QwenLocal.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: QwenLocal-IPA
          path: QwenLocal.ipa
